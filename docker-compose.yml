services:
  nodelink:
    image: performanc/nodelink:latest
    container_name: songascribe_nodelink
    ports:
      - "2333:2333"
    environment:
      NODELINK_SERVER_HOST: "0.0.0.0"
      NODELINK_SERVER_PORT: "2333"
      NODELINK_SERVER_PASSWORD: "youshallnotpass"

      # Required: enables the raw-PCM HTTP endpoint Songascribe streams from.
      NODELINK_ENABLELOADSTREAMENDPOINT: "true"

      # Default sources. Add Spotify/Deezer/etc. credentials here if needed.
      NODELINK_SOURCES_YOUTUBE_ENABLED: "true"
      NODELINK_SOURCES_SOUNDCLOUD_ENABLED: "true"
      NODELINK_SOURCES_BANDCAMP_ENABLED: "true"
    restart: unless-stopped
