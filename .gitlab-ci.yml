pages:
  image: node
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run generate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  artifacts:
    paths:
      - .output/public
  variables:
    NUXT_OAUTH_SPOTIFY_CLIENT_ID: $NUXT_OAUTH_SPOTIFY_CLIENT_ID
    NUXT_OAUTH_SPOTIFY_CLIENT_SECRET: $NUXT_OAUTH_SPOTIFY_CLIENT_SECRET
    NUXT_OAUTH_SPOTIFY_REDIRECT_URL: $NUXT_OAUTH_SPOTIFY_REDIRECT_URL
    NUXT_SESSION_PASSWORD: $NUXT_SESSION_PASSWORD
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
