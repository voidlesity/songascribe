stages:
  - build

variables:
  IMAGE_NAME: "$DOCKERHUB_USERNAME/songascribe"
  DOCKER_TLS_CERTDIR: "/certs"

build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    # Build & push on the default branch and on git tags.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$CI_COMMIT_TAG latest"
      else
        TAGS="$CI_COMMIT_SHORT_SHA latest"
      fi
    - |
      BUILD_ARGS=""
      for t in $TAGS; do
        BUILD_ARGS="$BUILD_ARGS -t $IMAGE_NAME:$t"
      done
    - docker build $BUILD_ARGS -f dockerfile .
    - |
      for t in $TAGS; do
        docker push "$IMAGE_NAME:$t"
      done
  after_script:
    - docker logout
