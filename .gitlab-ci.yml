stages:
  - build

variables:
  IMAGE_NAME: "$DOCKERHUB_USERNAME/songascribe"

build-and-push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    # Build & push on the default branch and on git tags.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="--destination $IMAGE_NAME:$CI_COMMIT_TAG --destination $IMAGE_NAME:latest"
      else
        DESTINATIONS="--destination $IMAGE_NAME:$CI_COMMIT_SHORT_SHA --destination $IMAGE_NAME:latest"
      fi
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/dockerfile"
      $DESTINATIONS
