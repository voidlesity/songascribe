stages:
  - install
  - quality
  - build
  - publish

default:
  image: node:26-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  IMAGE_NAME: "$DOCKERHUB_USERNAME/songascribe"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

install:
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# These jobs become active automatically as the corresponding package scripts land.
lint:
  stage: quality
  dependencies:
    - install
  script:
    - npm run lint --if-present

typecheck:
  stage: quality
  dependencies:
    - install
  script:
    - npm run typecheck --if-present

test:
  stage: quality
  dependencies:
    - install
  script:
    - npm run test --if-present

build-app:
  stage: build
  dependencies:
    - install
  script:
    - npm run build
  artifacts:
    paths:
      - .output/
    expire_in: 1 hour

build-and-push:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies: []
  rules:
    # Build and push only after all earlier jobs pass, on the default branch or tags.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p /kaniko/.docker
    - |
      AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="--destination $IMAGE_NAME:$CI_COMMIT_TAG --destination $IMAGE_NAME:latest"
      else
        DESTINATIONS="--destination $IMAGE_NAME:$CI_COMMIT_SHORT_SHA --destination $IMAGE_NAME:latest"
      fi
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/dockerfile"
      $DESTINATIONS
