workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + merge request pipelines.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - publish

check:
  stage: check
  image: node:26-alpine
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    NUXT_TELEMETRY_DISABLED: "1"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    # See dockerfile: skip the implicit better-sqlite3 node-gyp rebuild.
    - npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
    - npx nuxt prepare
    - npm run format:check
    - npm run lint
    - npm run typecheck
    - npm run build

publish:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    IMAGE_NAME: "$DOCKERHUB_USERNAME/songascribe"
  script:
    - |
      if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
        echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not available to this job." >&2
        echo "Protected variables are only passed to protected refs: protect the" >&2
        echo "tags (Settings > Repository > Protected tags) or unprotect the variables." >&2
        exit 1
      fi
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
    - printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/dockerfile"
      --destination "$IMAGE_NAME:$CI_COMMIT_TAG"
      --destination "$IMAGE_NAME:latest"
