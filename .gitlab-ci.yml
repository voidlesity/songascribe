stages:
  - build

variables:
  IMAGE_NAME: "$DOCKERHUB_USERNAME/songascribe"

build-and-push:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p /kaniko/.docker
    - |
      # Robust JSON generation to fix the "Invalid auth configuration" error
      printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' \
        "$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    - |
      DESTINATIONS="--destination $IMAGE_NAME:$CI_COMMIT_TAG"
      DESTINATIONS="$DESTINATIONS --destination $IMAGE_NAME:latest"
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/dockerfile"
      $DESTINATIONS